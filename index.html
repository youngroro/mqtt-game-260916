<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MQTT 多人賽跑</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header class="app-header">
      <div>
        <h1>🏁 MQTT 多人賽跑</h1>
        <p class="subtitle">GitHub Pages + MQTT WebSocket</p>
      </div>
      <div id="connStatus" class="conn-status offline">MQTT：連線中...</div>
    </header>

    <section id="screen-login" class="screen">
      <div class="card">
        <h2>你的暱稱</h2>
        <input id="nicknameInput" type="text" maxlength="16" placeholder="例如：Olive" autocomplete="off" />
      </div>

      <div class="card">
        <h2>建立房間</h2>
        <label class="field-label" for="finishDistanceSelect">終點距離</label>
        <select id="finishDistanceSelect">
          <option value="20">20 格（快）</option>
          <option value="30" selected>30 格（標準）</option>
          <option value="50">50 格（長）</option>
        </select>
        <button id="createRoomBtn" class="primary full">建立房間</button>
      </div>

      <div class="card">
        <h2>加入房間</h2>
        <div class="join-row">
          <input id="roomCodeInput" type="text" maxlength="5" placeholder="房間代碼" autocomplete="off" />
          <button id="joinRoomBtn" class="primary">加入</button>
        </div>

        <div class="room-list-header">
          <h3>目前可加入房間</h3>
          <button id="refreshRoomsBtn" class="secondary small">重新整理</button>
        </div>
        <ul id="roomList" class="room-list"></ul>
      </div>

      <p id="loginError" class="error-text"></p>
    </section>

    <section id="screen-lobby" class="screen" hidden>
      <div class="card">
        <div class="room-code-box">
          <span>房間代碼</span>
          <strong id="lobbyRoomId">-----</strong>
        </div>

        <p>終點距離：<strong><span id="lobbyFinishDistance">30</span> 格</strong></p>

        <h3>玩家</h3>
        <ul id="lobbyPlayers" class="player-list"></ul>

        <button id="startGameBtn" class="primary full" hidden>開始比賽</button>
        <p id="lobbyWaitingMsg" class="hint">等待房主開始比賽...</p>
      </div>
    </section>

    <section id="screen-game" class="screen" hidden>
      <div class="game-status card compact">
        <div>房間：<strong id="gameRoomId">-----</strong></div>
        <div>終點：<strong><span id="gameFinishDistance">30</span> 格</strong></div>
      </div>

      <div id="raceTrack" class="race-track"></div>

      <div class="control-card card">
        <div class="my-progress">
          我的進度：<strong><span id="myPosition">0</span>/<span id="myFinishDistance">30</span></strong>
        </div>
        <button id="runBtn" class="run-button">🏃 跑！</button>
        <p class="hint">每按一次前進 1 格；自己的畫面會立即更新，再透過 MQTT 同步給其他玩家。</p>
      </div>
    </section>

    <section id="screen-result" class="screen" hidden>
      <div class="card result-card">
        <div class="trophy">🏆</div>
        <h2 id="resultTitle">比賽結束！</h2>
        <ol id="finalLeaderboard" class="leaderboard"></ol>
        <button id="backToHomeBtn" class="primary full">回首頁</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
