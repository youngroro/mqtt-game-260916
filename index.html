<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MQTT 打地鼠遊戲</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>🐹 MQTT 打地鼠大戰</h1>
    <div id="connStatus" class="conn-status offline">MQTT: 連線中...</div>
  </header>

  <!-- ===== Login / Lobby list screen ===== -->
  <section id="screen-login" class="screen">
    <div class="card">
      <h2>1. 輸入暱稱</h2>
      <input id="nicknameInput" type="text" placeholder="你的暱稱" maxlength="16" />
    </div>

    <div class="card">
      <h2>2. 建立新房間</h2>
      <div class="form-row">
        <label>遊戲時長
          <select id="durationSelect">
            <option value="30">30 秒</option>
            <option value="60" selected>60 秒</option>
            <option value="90">90 秒</option>
          </select>
        </label>
        <label>格子大小
          <select id="gridSizeSelect">
            <option value="3" selected>3 x 3</option>
            <option value="4">4 x 4</option>
          </select>
        </label>
      </div>
      <button id="createRoomBtn">建立房間</button>
    </div>

    <div class="card">
      <h2>3. 加入現有房間</h2>
      <div class="form-row">
        <input id="roomCodeInput" type="text" placeholder="房間代碼" maxlength="8" style="text-transform:uppercase" />
        <button id="joinRoomBtn">加入</button>
      </div>
      <div class="room-list-header">
        <h3>目前的房間</h3>
        <button id="refreshRoomsBtn" class="secondary">重新整理</button>
      </div>
      <ul id="roomList" class="room-list"></ul>
    </div>

    <p id="loginError" class="error-text"></p>
  </section>

  <!-- ===== Lobby (waiting room) screen ===== -->
  <section id="screen-lobby" class="screen" hidden>
    <div class="card">
      <h2>房間代碼：<span id="lobbyRoomId"></span></h2>
      <p>把這個代碼分享給朋友，讓他們在「加入現有房間」輸入即可一起玩。</p>
      <p>格子大小：<span id="lobbyGridSize"></span> ｜ 時長：<span id="lobbyDuration"></span> 秒</p>
      <h3>玩家列表</h3>
      <ul id="lobbyPlayers" class="player-list"></ul>
      <button id="startGameBtn" hidden>開始遊戲（房主）</button>
      <p id="lobbyWaitingMsg">等待房主開始遊戲...</p>
    </div>
  </section>

  <!-- ===== Game screen ===== -->
  <section id="screen-game" class="screen" hidden>
    <div class="game-topbar">
      <div class="timer">⏱️ <span id="timeRemaining">--</span>s</div>
      <div class="my-score">你的分數：<span id="myScore">0</span></div>
    </div>
    <div id="grid" class="grid"></div>
    <h3>即時排行榜</h3>
    <ol id="scoreboard" class="scoreboard"></ol>
  </section>

  <!-- ===== Result screen ===== -->
  <section id="screen-result" class="screen" hidden>
    <div class="card">
      <h2>🏆 遊戲結束！</h2>
      <ol id="finalLeaderboard" class="scoreboard"></ol>
      <button id="backToLobbyBtn">回到大廳</button>
    </div>
  </section>

</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="game.js"></script>
</body>
</html>
